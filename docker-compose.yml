services:
  postgres-db:
    container_name: ice-skate-db
    image: postgres:18.4
    ports:
      - "5000:5432"
    volumes:
      - C:/tami/ice-skate/ice-skate-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ice-skate-db
